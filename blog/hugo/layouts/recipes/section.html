{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<div class="post-description">{{ . }}</div>{{ end }}
</header>
<div class="post-content">
  {{ .Content }}
  <ul>
    {{ range .RegularPages.ByTitle }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</div>
{{ end }}
